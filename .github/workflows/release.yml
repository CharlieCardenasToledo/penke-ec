name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Maven (Windows)
        shell: pwsh
        run: |
          choco install maven --no-progress -y
          $mavenRoot = Join-Path $env:ChocolateyInstall "lib\maven"
          $mavenCmd = Get-ChildItem -Path $mavenRoot -Filter "mvn.cmd" -Recurse -File | Select-Object -First 1
          if ($null -eq $mavenCmd) {
            throw "No se encontró mvn.cmd dentro de $mavenRoot"
          }
          $mavenBin = $mavenCmd.DirectoryName
          $mavenHome = Split-Path -Parent $mavenBin
          $env:Path = "$mavenBin;$env:Path"
          & $mavenCmd.FullName -version
          $mavenBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "MAVEN_HOME=$mavenHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MAVEN_CMD=$($mavenCmd.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build Java backend
        run: npm run build:backend

      - name: Build embedded Java runtime
        run: npm run build:runtime

      - name: Validate updater signing configuration
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "Falta el secreto TAURI_SIGNING_PRIVATE_KEY. Configúralo antes de publicar una release."
          }

      - name: Build & release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Penké EC ${{ github.ref_name }}"
          releaseBody: |
            Consulta el [historial de cambios](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md) para ver las novedades de esta versión.

            Descarga el instalador de tu sistema más abajo y ábrelo. No necesitas instalar nada más.
          releaseDraft: false
          prerelease: false

  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build Java backend
        run: npm run build:backend

      - name: Build embedded Java runtime
        run: npm run build:runtime

      - name: Validate updater signing configuration
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: test -n "$TAURI_SIGNING_PRIVATE_KEY"

      - name: Build & release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          args: --target universal-apple-darwin
          tagName: ${{ github.ref_name }}
          releaseName: "Penké EC ${{ github.ref_name }}"
          releaseBody: |
            Consulta el [historial de cambios](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md) para ver las novedades de esta versión.

            Descarga el instalador de tu sistema más abajo y ábrelo. No necesitas instalar nada más.
          releaseDraft: false
          prerelease: false

  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instalar dependencias del sistema (Tauri en Linux)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf

      - name: Install dependencies
        run: npm ci

      - name: Build Java backend
        run: npm run build:backend

      - name: Build embedded Java runtime
        run: npm run build:runtime

      - name: Validate updater signing configuration
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: test -n "$TAURI_SIGNING_PRIVATE_KEY"

      - name: Build & release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # Ubuntu 24.04 no siempre expone FUSE 2 para ejecutar los AppImages
          # auxiliares de linuxdeploy. Esta variable permite que linuxdeploy
          # se ejecute extraído y evita que falle antes de crear el AppImage.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Penké EC ${{ github.ref_name }}"
          releaseBody: |
            Consulta el [historial de cambios](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md) para ver las novedades de esta versión.

            Descarga el instalador de tu sistema más abajo y ábrelo. No necesitas instalar nada más.
          releaseDraft: false
          prerelease: false

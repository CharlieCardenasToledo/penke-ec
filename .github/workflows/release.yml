name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build & release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Penké EC ${{ github.ref_name }}"
          releaseBody: |
            ## ¿Qué hay de nuevo?

            Consulta el [CHANGELOG](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md) para ver los cambios de esta versión.

            ## Instalación

            1. Descarga el archivo `.msi` o `.exe` de abajo
            2. Ejecuta el instalador
            3. ¡Listo! No se requiere ningún software adicional

            > **Nota:** Windows puede mostrar una advertencia de SmartScreen la primera vez. Haz clic en "Más información" → "Ejecutar de todas formas".
          releaseDraft: false
          prerelease: false
